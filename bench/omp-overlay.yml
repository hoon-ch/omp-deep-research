# Frozen OMP settings for the scout-allocation benchmark (loaded with --config).
# Pins selectable mission model roles and removes fallback/memory variance.
# Built-in find uses OMP's own unversioned judge backend; this overlay cannot pin its provider revision.
modelRoles:
  default: openai-codex/gpt-6.1-sol:high
  smol: alibaba-token-plan/qwen3.8-flash:medium
  review_worker: anthropic/claude-sonnet-5-5:medium
  web: google-antigravity/gemini-3.8-flash
task:
  agentModelOverrides:
    scout: "@smol"
retry:
  modelFallback: false
memory:
  backend: "off"
advisor:
  enabled: false
